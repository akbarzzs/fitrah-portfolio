<!DOCTYPE html>
<html lang="id">
  <head>
    <title>Contact Form Registration</title>
  </head>
  <body>
    <!-- Form statis ini disembunyikan dan hanya untuk dibaca bot Netlify saat proses build -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
