backend:
  name: github
  repo: akbarzzs/fitrah-portfolio
  branch: main
  # (Baris local_backend dan proxy_url nanti dihapus/tidak dipakai saat online)

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" } # <-- Ini nih editor ala Word-nya!